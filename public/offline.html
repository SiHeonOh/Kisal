<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KISAL — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F4EFE6;
      color: #1C223A;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 48px;
      background: #1C223A;
      display: flex;
      align-items: center;
      padding: 0 24px;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #fff;
    }
    main {
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 14px; color: #6B5A45; }
    button {
      margin-top: 24px;
      padding: 10px 24px;
      background: #F44E1C;
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header><span class="logo">KISAL</span></header>
  <main>
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </main>
</body>
</html>
